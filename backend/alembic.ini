[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os
version_path_separator = os

# DATABASE_URL is intentionally not stored here. alembic/env.py reads the
# same Oracle DATABASE_URL used by the application, including backend/.env.
sqlalchemy.url = oracle+oracledb://unused:unused@localhost:1521/?service_name=UNUSED

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
