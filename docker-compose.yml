services:
  migrate:
    image: qualityops-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - ${APP_ENV_FILE:-.env}

    command: ["alembic", "upgrade", "head"]

    restart: "no"

  backend:
    image: qualityops-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile

    expose:
      - "8000"

    env_file:
      - ${APP_ENV_FILE:-.env}

    environment:
      UPLOAD_STORAGE_ROOT: /data/qualityops/uploads
      DOCUMENT_PORTAL_EMBEDDED: "false"

    volumes:
      - ${UPLOAD_STORAGE_HOST_PATH:-./storage}/uploads:/data/qualityops/uploads:Z
      - ${UPLOAD_STORAGE_HOST_PATH:-./storage}/logs:/app/logs:Z

    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=5)); raise SystemExit(0 if d.get('status') == 'ok' else 1)",
        ]
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 30s

    restart: unless-stopped

  document_portal:
    image: qualityops-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile

    expose:
      - "8000"

    env_file:
      - ${APP_ENV_FILE:-.env}

    environment:
      WEB_CONCURRENCY: ${DOCUMENT_PORTAL_WEB_CONCURRENCY:-2}
      DB_POOL_SIZE: ${DOCUMENT_PORTAL_DB_POOL_SIZE:-2}
      DB_MAX_OVERFLOW: ${DOCUMENT_PORTAL_DB_MAX_OVERFLOW:-1}
      DOCUMENT_PORTAL_STORAGE_HOST_PATH: /data/qualityops/document-storage/repository
      TMPDIR: /data/qualityops/document-storage/work

    command:
      - sh
      - -c
      - mkdir -p "$$DOCUMENT_PORTAL_STORAGE_HOST_PATH" "$$TMPDIR" && exec uvicorn app.document_portal_main:app --host 0.0.0.0 --port 8000 --workers "$$WEB_CONCURRENCY"

    volumes:
      - ${DOCUMENT_PORTAL_STORAGE_HOST_PATH:-./storage/document-portal}:/data/qualityops/document-storage:Z
      - qa_portal_document_logs:/app/logs

    depends_on:
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=5)); raise SystemExit(0 if d.get('status') == 'ok' else 1)",
        ]
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 20s

    restart: unless-stopped

  redis:
    # Third-party runtime image: keep the vendor name (do not present it as
    # a QualityOps-built artifact), but fully qualify it so Podman never has
    # to resolve an ambiguous short name. Load this exact tag before using
    # `--pull never` on an offline host.
    image: docker.io/library/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - qa_portal_redis:/data

  frontend:
    image: qualityops-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:443"
    volumes:
      # The same frontend image is promoted through every environment. The
      # selected host directory must contain qualityops.crt and qualityops.key.
      # Mounting the directory keeps the environment configuration to one path
      # while nginx continues to use stable in-container filenames.
      - ${TLS_CERT_HOST_PATH:?Set TLS_CERT_HOST_PATH to the certificate directory in the selected environment file}:/etc/nginx/ssl:ro,Z
    depends_on:
      backend:
        condition: service_healthy
      document_portal:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # These legacy volume keys are intentionally retained: renaming a volume
  # disconnects an existing deployment from its persisted Redis data/logs.
  qa_portal_redis:
  qa_portal_document_logs:
