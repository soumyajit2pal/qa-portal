services:
  migrate:
    image: qualityops-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - ${APP_ENV_FILE:?Set APP_ENV_FILE to the intended deployment environment file}

    environment:
      APP_ENV_FILE: /run/config/qualityops.env
      TZ: Asia/Kolkata

    command: ["alembic", "upgrade", "head"]

    # Migration needs database access, not a writable image filesystem or
    # Linux capabilities. Keep any compromise inside the smallest boundary.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    volumes:
      # The same read-only file is shared by all Python services; lowercase z
      # gives it a shared SELinux label rather than relabeling it per container.
      - ${APP_ENV_FILE:?Set APP_ENV_FILE to the intended deployment environment file}:/run/config/qualityops.env:ro,z

    restart: "no"

  backend:
    image: qualityops-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile

    expose:
      - "8000"

    env_file:
      - ${APP_ENV_FILE:?Set APP_ENV_FILE to the intended deployment environment file}

    environment:
      APP_ENV_FILE: /run/config/qualityops.env
      TZ: Asia/Kolkata
      UPLOAD_STORAGE_ROOT: /data/qualityops/uploads
      DOCUMENT_PORTAL_EMBEDDED: "false"
      DOCUMENT_PORTAL_STORAGE_HOST_PATH: /data/qualityops/document-storage/repository
      LOGIN_ENCRYPTION_PRIVATE_KEY_FILE: /run/secrets/qualityops/login-private.pem
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_COORDINATION_URL: ${REDIS_COORDINATION_URL:-redis://redis_coordination:6379/0}
      JOB_QUEUE_BACKEND: ${JOB_QUEUE_BACKEND:-redis}
      NOTIFICATION_WORKER_MODE: ${NOTIFICATION_WORKER_MODE:-dedicated}
      LOGIN_RATE_LIMIT_BACKEND: ${LOGIN_RATE_LIMIT_BACKEND:-redis}

    # Read the trust list from the selected service env_file at runtime.
    # Uvicorn must trust only nginx's source IP for forwarding metadata.
    command:
      - sh
      - -c
      - exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers "$${WEB_CONCURRENCY:-4}" --proxy-headers --forwarded-allow-ips "$${FORWARDED_ALLOW_IPS:?Set FORWARDED_ALLOW_IPS to the nginx container IP in the selected environment file}"

    volumes:
      - ${APP_ENV_FILE:?Set APP_ENV_FILE to the intended deployment environment file}:/run/config/qualityops.env:ro,z
      - ${LOGIN_ENCRYPTION_KEY_HOST_DIR:-./secrets}:/run/secrets/qualityops:ro,Z
      - ${UPLOAD_STORAGE_HOST_PATH:-./storage}/uploads:/data/qualityops/uploads:z
      - ${UPLOAD_STORAGE_HOST_PATH:-./storage}/logs:/app/logs:z
      # Workspace administration and the document service must see the same
      # files and quota locks. Lowercase z permits both SELinux containers.
      - ${DOCUMENT_PORTAL_STORAGE_HOST_PATH:-./storage/document-portal}:/data/qualityops/document-storage:z

    # Runtime state is restricted to the explicit storage/log mounts above.
    # The application image itself is immutable and needs no Linux
    # capabilities (port 8000 is unprivileged).
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m

    depends_on:
      migrate:
        condition: service_completed_successfully
      redis_coordination:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=5)); raise SystemExit(0 if d.get('status') == 'ok' else 1)",
        ]
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 30s

    restart: unless-stopped

  document_portal:
    image: qualityops-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile

    expose:
      - "8000"

    env_file:
      - ${APP_ENV_FILE:?Set APP_ENV_FILE to the intended deployment environment file}

    environment:
      APP_ENV_FILE: /run/config/qualityops.env
      TZ: Asia/Kolkata
      WEB_CONCURRENCY: ${DOCUMENT_PORTAL_WEB_CONCURRENCY:-2}
      DB_POOL_SIZE: ${DOCUMENT_PORTAL_DB_POOL_SIZE:-2}
      DB_MAX_OVERFLOW: ${DOCUMENT_PORTAL_DB_MAX_OVERFLOW:-1}
      DOCUMENT_PORTAL_STORAGE_HOST_PATH: /data/qualityops/document-storage/repository
      TMPDIR: /data/qualityops/document-storage/work

    command:
      - sh
      - -c
      - mkdir -p "$$DOCUMENT_PORTAL_STORAGE_HOST_PATH" "$$TMPDIR" && exec uvicorn app.document_portal_main:app --host 0.0.0.0 --port 8000 --workers "$$WEB_CONCURRENCY" --proxy-headers --forwarded-allow-ips "$${FORWARDED_ALLOW_IPS:?Set FORWARDED_ALLOW_IPS to the nginx container IP in the selected environment file}"

    volumes:
      - ${APP_ENV_FILE:?Set APP_ENV_FILE to the intended deployment environment file}:/run/config/qualityops.env:ro,z
      - ${DOCUMENT_PORTAL_STORAGE_HOST_PATH:-./storage/document-portal}:/data/qualityops/document-storage:z
      - qa_portal_document_logs:/app/logs

    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m

    depends_on:
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=5)); raise SystemExit(0 if d.get('status') == 'ok' else 1)",
        ]
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 20s

    restart: unless-stopped

  redis:
    # Third-party runtime image: keep the vendor name (do not present it as
    # a QualityOps-built artifact), but fully qualify it so Podman never has
    # to resolve an ambiguous short name. Load this exact tag before using
    # `--pull never` on an offline host.
    image: docker.io/library/redis:8.10.1-alpine3.23
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory
      - ${REDIS_CACHE_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    mem_limit: ${REDIS_CACHE_CONTAINER_MEMORY:-512m}

    healthcheck:
      test:
        ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - qa_portal_redis:/data

  # Durable coordination has a separate memory/eviction boundary. A second
  # logical Redis database cannot protect queues from cache eviction.
  redis_coordination:
    image: docker.io/library/redis:8.10.1-alpine3.23
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - always
      - --maxmemory
      - ${REDIS_COORDINATION_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
    mem_limit: ${REDIS_COORDINATION_CONTAINER_MEMORY:-512m}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - qa_portal_redis_coordination:/data

  job_worker:
    image: qualityops-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ${APP_ENV_FILE:?Set APP_ENV_FILE to the intended deployment environment file}
    environment:
      APP_ENV_FILE: /run/config/qualityops.env
      TZ: Asia/Kolkata
      UPLOAD_STORAGE_ROOT: /data/qualityops/uploads
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_COORDINATION_URL: ${REDIS_COORDINATION_URL:-redis://redis_coordination:6379/0}
      JOB_QUEUE_BACKEND: redis
      NOTIFICATION_WORKER_MODE: dedicated
      LOGIN_RATE_LIMIT_BACKEND: ${LOGIN_RATE_LIMIT_BACKEND:-redis}
      DB_POOL_SIZE: ${JOB_WORKER_DB_POOL_SIZE:-2}
      DB_MAX_OVERFLOW: ${JOB_WORKER_DB_MAX_OVERFLOW:-1}
      AUDIT_DB_POOL_SIZE: 1
      AUDIT_DB_MAX_OVERFLOW: 0
      LOG_FILE_NAME: jobs.log
    command: ["python", "-m", "app.job_worker"]
    volumes:
      - ${APP_ENV_FILE:?Set APP_ENV_FILE to the intended deployment environment file}:/run/config/qualityops.env:ro,z
      - ${UPLOAD_STORAGE_HOST_PATH:-./storage}/uploads:/data/qualityops/uploads:z
      - ${UPLOAD_STORAGE_HOST_PATH:-./storage}/logs:/app/logs:z
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis_coordination:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.job_worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 2m
    restart: unless-stopped

  notification_worker:
    image: qualityops-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ${APP_ENV_FILE:?Set APP_ENV_FILE to the intended deployment environment file}
    environment:
      APP_ENV_FILE: /run/config/qualityops.env
      TZ: Asia/Kolkata
      UPLOAD_STORAGE_ROOT: /data/qualityops/uploads
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_COORDINATION_URL: ${REDIS_COORDINATION_URL:-redis://redis_coordination:6379/0}
      JOB_QUEUE_BACKEND: redis
      NOTIFICATION_WORKER_MODE: dedicated
      LOGIN_RATE_LIMIT_BACKEND: ${LOGIN_RATE_LIMIT_BACKEND:-redis}
      DB_POOL_SIZE: ${NOTIFICATION_WORKER_DB_POOL_SIZE:-2}
      DB_MAX_OVERFLOW: ${NOTIFICATION_WORKER_DB_MAX_OVERFLOW:-1}
      AUDIT_DB_POOL_SIZE: 1
      AUDIT_DB_MAX_OVERFLOW: 0
      LOG_FILE_NAME: notifications.log
    command: ["python", "-m", "app.notification_worker"]
    volumes:
      - ${APP_ENV_FILE:?Set APP_ENV_FILE to the intended deployment environment file}:/run/config/qualityops.env:ro,z
      - ${UPLOAD_STORAGE_HOST_PATH:-./storage}/uploads:/data/qualityops/uploads:z
      - ${UPLOAD_STORAGE_HOST_PATH:-./storage}/logs:/app/logs:z
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis_coordination:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.notification_worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 2m
    restart: unless-stopped

  frontend:
    image: qualityops-frontend:${IMAGE_TAG:-latest}
    environment:
      TZ: Asia/Kolkata
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:8443"
    volumes:
      # The same frontend image is promoted through every environment. The
      # selected host directory must contain qualityops.crt and qualityops.key.
      # Mount only those files so nginx cannot read unrelated keys from a
      # shared certificate directory.
      - ${TLS_CERT_HOST_PATH:?Set TLS_CERT_HOST_PATH to the certificate directory in the selected environment file}/qualityops.crt:/etc/nginx/ssl/qualityops.crt:ro,Z
      - ${TLS_CERT_HOST_PATH:?Set TLS_CERT_HOST_PATH to the certificate directory in the selected environment file}/qualityops.key:/etc/nginx/ssl/qualityops.key:ro,Z
    depends_on:
      backend:
        condition: service_healthy
      document_portal:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      # These mounts hide the ownership prepared in the image, so assign them
      # to the non-root nginx runtime user explicitly.
      - /var/cache/nginx:rw,noexec,nosuid,size=64m,uid=101,gid=101,mode=0755
      - /var/run:rw,noexec,nosuid,size=8m,uid=101,gid=101,mode=0755
    restart: unless-stopped

volumes:
  # These legacy volume keys are intentionally retained: renaming a volume
  # disconnects an existing deployment from its persisted Redis data/logs.
  qa_portal_redis:
  qa_portal_redis_coordination:
  qa_portal_document_logs:
