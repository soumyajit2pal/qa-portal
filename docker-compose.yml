services:

  migrate:
    image: qualityops-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - .env

    command: ["alembic", "upgrade", "head"]

    restart: "no"

  backend:
    image: qualityops-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile

    expose:
      - "8000"

    env_file:
      - .env

    environment:
      # Runtime uploads always use this Docker-managed container path.
      UPLOAD_STORAGE_ROOT: /data/qualityops/uploads

    volumes:
      # Set UPLOAD_STORAGE_HOST_PATH to an absolute host/NFS directory to
      # use a bind mount; when omitted, the existing named volume is used.
      - ${UPLOAD_STORAGE_HOST_PATH:-qa_portal_uploads}:/data/qualityops/uploads
      - qa_portal_logs:/app/logs

    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=5)); raise SystemExit(0 if d.get('status') == 'ok' else 1)"
        ]
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 30s

    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - qa_portal_redis:/data


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:443"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped


volumes:
  qa_portal_uploads:
  qa_portal_redis:
  qa_portal_logs:
