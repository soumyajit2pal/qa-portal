services:

  migrate:
    image: qualityops-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - .env

    command: ["alembic", "upgrade", "head"]

    restart: "no"

    extra_hosts:
      - "host.docker.internal:host-gateway"


  backend:
    image: qualityops-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - qa_portal_uploads:/app/app/uploads
      - qa_portal_logs:/app/logs

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=5)); raise SystemExit(0 if d.get('status') == 'ok' else 1)"
        ]
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 30s

    restart: unless-stopped


  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    volumes:
      - qa_portal_redis:/data


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      # 8080:80 kept for local/dev use (plain HTTP, no domain needed). The
      # real HTTPS entry points are 80 (redirects to 443) and 443 itself --
      # both only work once DOMAIN_NAME is set below and
      # scripts/init-letsencrypt.sh has been run once. See README.md's
      # "Enable HTTPS" section.
      - "8080:80"
      - "80:80"
      - "443:443"

    environment:
      # Substituted into nginx.conf.template at container start (see that
      # file's own header comment) -- required for the 443 server block to
      # find its certificate under /etc/letsencrypt/live/${DOMAIN_NAME}/.
      # Leave unset (or run scripts/init-letsencrypt.sh) and nginx falls
      # back to whatever default.conf.template resolves to with an empty
      # DOMAIN_NAME, which will fail to start -- HTTPS is opt-in, not
      # automatic, on a fresh checkout.
      - DOMAIN_NAME=${DOMAIN_NAME:-}

    volumes:
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped


  # Renews the Let's Encrypt certificate every 12h (certbot itself only
  # actually renews when a cert is within 30 days of expiry, so this is
  # just a cheap, safe polling interval, not 12h of real renewal work).
  # Does NOT obtain the FIRST certificate -- that one-time bootstrap is
  # scripts/init-letsencrypt.sh, run manually before `docker compose up` on
  # a brand-new host/domain. This service only needs to run at all if
  # you're using HTTPS; it's harmless (idle) otherwise.
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"
    restart: unless-stopped

volumes:
  qa_portal_uploads:
  qa_portal_redis:
  qa_portal_logs:
  certbot_conf:
  certbot_www: