# Full-stack orchestration for the Centralized QA Portal.
#
# Architecture: one backend image + one frontend image (a single React +
# Vite app -- previously split into a Module Federation shell + 4
# independently-deployed module remotes; that split was collapsed back into
# one app/build/deploy since it shipped as one unit in practice anyway).
#
# Usage:
#   docker compose up --build
#   Frontend: http://localhost:8080
#   API:      http://localhost:8000

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Point this at your Oracle instance. This compose file does not run
      # Oracle itself -- see README "Database setup" for the bank's Oracle
      # instance (Option A) or a local gvenzl/oracle-free container
      # (Option B) to run alongside this stack.
      DATABASE_URL: ${DATABASE_URL:-oracle+oracledb://qa_portal:qa_portal_pwd@host.docker.internal:1521/?service_name=FREEPDB1}
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-long-random-string-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
    volumes:
      - qa_portal_uploads:/app/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qa_portal_uploads:
