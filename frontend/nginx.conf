# SUPERSEDED -- kept only as a reference/no-longer-built fallback. HTTPS
# enablement (see README.md's "Enable HTTPS" section) replaced this static,
# HTTP-only config with frontend/nginx.conf.template, which the Dockerfile
# now copies into the image instead of this file. Delete this file once
# you've confirmed the HTTPS setup works for your deployment; it's left in
# place for now purely so a `git diff`/`git rm` decision is explicit rather
# than silently removed by an automated change.
#
# If you deliberately do NOT want TLS (e.g. HTTPS is terminated entirely
# outside this stack, at an external load balancer/ingress that always
# talks plain HTTP to this container), point the Dockerfile's COPY back at
# this file instead of nginx.conf.template -- it still works standalone,
# listening on port 80 only, with no redirect and no cert requirement.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API proxy so the built app's relative /api/* fetches (see
    # src/api.ts -- BASE_URL defaults to '' unless VITE_API_BASE_URL was set
    # at build time) reach the backend without any CORS setup. "backend"
    # resolves via Docker's internal DNS when this runs through
    # docker-compose.yml (the backend service there is named "backend"). If
    # you deploy this image outside that compose network, either rebuild
    # with VITE_API_BASE_URL pointing at the API's real URL instead (see
    # .env.example) and delete this location block, or edit proxy_pass below
    # to your backend's real host.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routed React app (react-router-dom) -- any path that isn't
    # a real static file falls back to index.html so deep links (e.g.
    # /functional-requests) work on a hard refresh, not just via in-app nav.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build assets (Vite fingerprints filenames), never
    # cache index.html itself so a new deploy is picked up immediately.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
