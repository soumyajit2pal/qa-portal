server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # This module is consumed cross-origin -- the shell (a different
    # container/domain/port) fetches remoteEntry.js and this module's async
    # chunks directly via `import()`. Without permissive CORS here, the
    # browser blocks that fetch and every route this module exposes breaks
    # in the shell with an opaque "Failed to fetch dynamically imported
    # module" error.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
