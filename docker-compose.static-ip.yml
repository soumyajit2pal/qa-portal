# Overlay on docker-compose.yml; frontend is the nginx TLS proxy.
# Select a subnet that does not overlap your bank/VPN or container networks.
# Override both PORTAL_SUBNET and PORTAL_NGINX_IP together when necessary.
services:
  frontend:
    networks:
      default:
        ipv4_address: ${PORTAL_NGINX_IP:-172.30.50.10}

  backend:
    environment:
      FORWARDED_ALLOW_IPS: ${PORTAL_NGINX_IP:-172.30.50.10}

  document_portal:
    environment:
      FORWARDED_ALLOW_IPS: ${PORTAL_NGINX_IP:-172.30.50.10}

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: ${PORTAL_SUBNET:-172.30.50.0/24}
          gateway: ${PORTAL_GATEWAY:-172.30.50.1}
